name: 'AI Quality Gate'
description: 'Audita cada PR con auditores de IA especializados y bloquea el merge hasta que pase.'
author: 'brunogianoli'

inputs:
  deepseek-api-key:
    description: 'API key de DeepSeek para los auditores.'
    required: true
  api-base-url:
    description: 'Endpoint compatible con el formato de la API de Anthropic. Por defecto, el de DeepSeek.'
    required: false
  github-token:
    description: 'Token con permiso para comentar y crear checks.'
    required: false
    default: ${{ github.token }}

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'shield'
  color: 'purple'
