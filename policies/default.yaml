model: deepseek-chat

required:
  - build
  - tests

block_on: [CRITICAL, HIGH]
comment_only: [MEDIUM, LOW, INFO]

min_confidence: 0.7

# Por auditor, no por corrida. Se puede pisar dentro de cada `auditors:`.
timeout_ms: 300000
max_retries: 1

on_test_failure:
  run_auditors: [scope, acceptance]

auditors:
  acceptance:
    when: criteria_available
  scope:
    when: always
  backend:
    when: [backend_changed]
  database:
    when: [database_changed]
  security:
    when: [auth_changed, deps_changed, endpoints_changed]
  infrastructure:
    when: [infra_changed]
